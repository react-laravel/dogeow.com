name: Deploy homepage to C

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-homepage-c
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: npm
      - name: Install locked build dependencies
        run: npm ci
      - name: Test and build static homepage
        run: |
          npm test
          npm run build
          node scripts/package-runtime.mjs
          du -sh .deploy-runtime
      - name: Validate the unchanged C homepage
        env:
          C_DEPLOY_SSH_KEY: ${{ secrets.C_DEPLOY_SSH_KEY }}
          C_DEPLOY_KNOWN_HOSTS: ${{ secrets.C_DEPLOY_KNOWN_HOSTS }}
        # C serves the original April homepage. CI migration must not publish
        # the newer master design on push or through a dispatch parameter.
        run: bash scripts/deploy-to-c.sh --check-only
      - name: Remove temporary upload bundle
        if: always()
        run: rm -rf .deploy-runtime
