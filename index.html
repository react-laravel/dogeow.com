<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta
      name="description"
      content="DogeOW 的个人入口页，包含实验室、Canvas、文件夹和其他常用链接。"
    />
    <meta property="og:title" content="DogeOW" />
    <meta
      property="og:description"
      content="DogeOW 的个人入口页，包含实验室、Canvas、文件夹和其他常用链接。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dogeow.com" />
    <meta
      property="og:image"
      content="https://upyun.dogeow.com/projects/DogeOW.png"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>DogeOW</title>
  </head>
  <body>
    <div class="page-shell">
      <div class="page-overlay"></div>
      <main class="hero">
        <h1 id="greeting" class="greeting">你好</h1>

        <section class="project-grid" aria-label="常用项目">
          <a
            class="project-card"
            href="https://next.dogeow.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="https://next.dogeow.com/80.png"
              alt="实验室"
              width="40"
              height="40"
            />
            <span>实验室</span>
          </a>
          <a
            class="project-card"
            href="https://mc.dogeow.com"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="https://upyun.dogeow.com/projects/minecraft_grass_block_texture.png!/fw/80"
              alt="我的世界"
              width="40"
              height="40"
            />
            <span>我的世界</span>
          </a>
        </section>

        <p id="doing" class="doing" hidden></p>
      </main>

      <footer class="site-footer">
        <p id="wallpaper-info" class="wallpaper-info" hidden></p>
        <a
          class="github-icon"
          href="https://github.com/dogeow"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="https://upyun.dogeow.com/projects/Octocat.svg"
            alt="GitHub"
            width="20"
            height="20"
          />
        </a>
        <p id="friend-links" class="friend-links" hidden></p>
        <div class="record-links">
          <a
            href="https://beian.miit.gov.cn/"
            target="_blank"
            rel="noopener noreferrer"
            >闽ICP备19021694号</a
          >
          <a
            href="https://www.beian.gov.cn/"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span>闽公网安备35020302033650号</span>
          </a>
        </div>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
